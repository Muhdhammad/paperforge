services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: paperforge-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped

  rag:
    build: .
    image: paperforge-rag:latest
    container_name: paperforge-rag
    ports:
      - "8003:8003"
    env_file:
      - .env
    depends_on:
      - qdrant
    environment:
      - QDRANT_URL=http://qdrant:6333
      - HF_TOKEN=${HF_TOKEN}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - JINA_API=${JINA_API}
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: paperforge-frontend
    ports:
      - "3000:80"
    depends_on:
      - rag
    restart: unless-stopped
